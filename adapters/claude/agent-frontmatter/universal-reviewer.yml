# tools: review role — Write only, for its report (no Edit/Bash/Agent; the write-scope hook keeps it to markdown); no memory: and no Skill — the report shape and the adversarial stance come inline (a skill listing costs ~30k chars per dispatch). Cursor and opencode render it read-only (build/merge-agent.py); a CLI with no write tool returns the report inline (agent-protocol).
tier: balanced
effort: high
tools:
  - Read
  - Glob
  - Grep
  - Write
  - WebFetch
  - WebSearch
